<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Estrada dos Mestres — sete reinos</title>
<style>
  :root { --bg:#07060b; --line:#3a2e1c; --gold:#e4c16a; --muted:#b7a48a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #f3ead7; }
  body { font-family: "Segoe UI", "Trebuchet MS", sans-serif; min-height: 100%; display: flex; flex-direction: column; }
  header, .hud, .ticker, footer { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #100e0c; border-bottom: 1px solid var(--line); }
  header { justify-content: space-between; }
  .brand { color: var(--gold); font-weight: 700; }
  .brand small { color: var(--muted); font-weight: 500; margin-left: 8px; }
  nav, .pills, .bars { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, .linkish { background: #1c1814; color: #f3ead7; border: 1px solid #4a3b24; border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; text-decoration: none; }
  button:hover, .linkish:hover { border-color: var(--gold); color: var(--gold); }
  .hud { justify-content: space-between; }
  .meter { min-width: 120px; }
  .meter span { font-size: 12px; color: var(--muted); }
  .track { height: 8px; background: #2a241c; border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .fill { height: 100%; width: 0; }
  .hp { background: linear-gradient(90deg, #ff5f8a, #ffd0dc); }
  .hunger { background: linear-gradient(90deg, #ff8a3d, #ffe08a); }
  .thirst { background: linear-gradient(90deg, #3d8dff, #9be7ff); }
  .axe { background: linear-gradient(90deg, #7cff6b, #fff1a8); }
  .stage { position: relative; flex: 1; display: grid; place-items: center; padding: 12px; background: radial-gradient(ellipse at center, #1a140f 0%, #07060b 72%); }
  canvas { width: min(1100px, 100%); height: auto; aspect-ratio: 16/9; background: #000; border: 1px solid #6a542c; border-radius: 10px; box-shadow: 0 0 0 6px #1a140f, 0 20px 60px rgba(0,0,0,.45); cursor: crosshair; image-rendering: pixelated; }
  #prompt, #toast { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; border-radius: 8px; }
  #prompt { top: 28px; display: none; background: #1a1408ee; border: 1px solid var(--gold); color: var(--gold); padding: 8px 14px; font-weight: 700; }
  #toast { bottom: 28px; max-width: min(760px, 92%); background: #120e0acc; border: 1px solid #4a3b24; padding: 8px 12px; }
  .ticker, footer { color: var(--muted); font-size: 13px; justify-content: space-between; }
  footer { border-top: 1px solid var(--line); border-bottom: 0; }
  kbd { border: 1px solid #4a3b24; border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--gold); }
  #drawer { position: absolute; right: 24px; top: 24px; width: min(360px, 92%); max-height: 70%; overflow: auto; background: #14110eee; border: 1px solid var(--gold); border-radius: 10px; padding: 12px; display: none; }
  #drawer h3 { margin: 0 0 8px; color: var(--gold); }
  #drawer p, #drawer li { font-size: 14px; }
  #mapScreen {
    display: none;
    position: absolute;
    inset: 16px;
    z-index: 6;
    background: #0c0a08f2;
    border: 1px solid var(--gold);
    border-radius: 12px;
    padding: 10px;
    flex-direction: column;
    gap: 8px;
  }
  #mapScreen.open { display: flex; }
  #mapCanvas { width: 100%; height: auto; background: #07060b; border-radius: 8px; cursor: pointer; image-rendering: pixelated; }
  .map-bar { display: flex; gap: 8px; align-items: center; }
  #mapTitle { color: var(--gold); }
  #mapHint { color: var(--muted); font-size: 13px; flex: 1; }
</style>
</head>
<body>
<header>
  <div class="brand">Estrada dos Mestres <small id="modeLabel">Reino dos Cruzeiros · espaço</small></div>
  <nav>
    <button type="button" id="btnGame">Jogo</button>
    <button type="button" id="btnReinos">Reinos</button>
    <button type="button" id="btnPontos">Pontos</button>
    <button type="button" id="btnAtlas">Atlas</button>
  </nav>
</header>
<div class="hud">
  <div class="bars">
    <div class="meter"><span id="hpText">Vida 100</span><div class="track"><div id="hpFill" class="fill hp"></div></div></div>
    <div class="meter"><span id="hungerText">Fome 70%</span><div class="track"><div id="hungerFill" class="fill hunger"></div></div></div>
    <div class="meter"><span id="thirstText">Sede 70%</span><div class="track"><div id="thirstFill" class="fill thirst"></div></div></div>
    <div class="meter"><span id="axeText">Axé</span><div class="track"><div id="axeFill" class="fill axe"></div></div></div>
  </div>
  <div class="pills">
    <button type="button" id="btnView">Mapa local</button>
    <button type="button" id="btnTorch">Tocha acesa</button>
    <span id="rescuedPill">Pontos 0/63</span>
  </div>
</div>
<div class="ticker">
  <span id="ticker">O Reino dos Cruzeiros não é uma cidade. É o espaço entre os outros seis.</span>
  <span><kbd>WASD</kbd> andar · <kbd>E</kbd> agir · <kbd>M</kbd> mapa local · Atlas = mapa-múndi</span>
</div>
<div class="stage">
  <canvas id="view" width="480" height="270"></canvas>
  <div id="prompt"></div>
  <div id="toast"></div>
  <aside id="drawer"></aside>
  <div id="mapScreen">
    <div class="map-bar">
      <strong id="mapTitle">Atlas</strong>
      <span id="mapHint"></span>
      <button type="button" id="mapBack">Voltar</button>
      <button type="button" id="mapClose">Fechar</button>
    </div>
    <canvas id="mapCanvas" width="720" height="400"></canvas>
  </div>
</div>
<footer>
  <div id="diary">Seis cidades. Um cruzeiro em cada uma. O sétimo reino liga todas.</div>
  <div id="where">espaço</div>
</footer>
<script>
(() => {
  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d");
  const mapCanvas = document.getElementById("mapCanvas");
  const mapCtx = mapCanvas.getContext("2d");
  const VIEW_W = canvas.width;
  const VIEW_H = canvas.height;
  const MW = 32;
  const MH = 32;

  function blank(fill) {
    return Array.from({ length: MH }, () => Array(MW).fill(fill));
  }
  function edge(m, tile) {
    for (let i = 0; i < MW; i++) {
      m[0][i] = tile; m[MH - 1][i] = tile; m[i][0] = tile; m[i][MW - 1] = tile;
    }
  }
  function fillRect(m, x0, y0, x1, y1, tile) {
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      if (y > 0 && x > 0 && y < MH - 1 && x < MW - 1) m[y][x] = tile;
    }
  }
  function corridor(m, x0, y0, x1, y1) {
    let x = x0;
    let y = y0;
    let guard = 0;
    while (guard++ < 80) {
      fillRect(m, x, y, x + 1, y + 1, 0);
      if (x === x1 && y === y1) break;
      if (x !== x1) x += Math.sign(x1 - x);
      else y += Math.sign(y1 - y);
    }
  }

  const ATLAS = {
    encruzilhadas: [
      ["e01", "Encruzilhada das Sete Vias", "Abertura de Caminhos", "Exu"],
      ["e02", "Caminho da Lua Negra", "Navegação Noturna", "Exu Mirim"],
      ["e03", "Praça dos Quatro Ventos", "Comunicação", "Exu das 4 Ventos"],
      ["e04", "Portal das Estradas", "Translocação", "Tata Caveira"],
      ["e05", "Viela das Lanternas", "Iluminação Espiritual", "Maria Mulambo"],
      ["e06", "Ponte dos Destinos", "Escolha", "Exu Lalu"],
      ["e07", "Mercado das Sombras", "Troca", "Exu Tiriri"],
      ["e08", "Estrada do Cruzeiro", "Proteção em Viagem", "Exu Caveira"],
      ["e09", "Marco das Três Trilhas", "Divinação", "Exu Marabô"]
    ],
    cruzeiros: [
      ["c01", "Cruzeiro das Brumas", "Visão na Neblina", "Caboclo do Cruzeiro"],
      ["c02", "Campo das Sete Cruzes", "Proteção Múltipla", "Sete Cruzeiros"],
      ["c03", "Vila do Marco Antigo", "Ancestralidade", "Velho do Cruzeiro"],
      ["c04", "Estrada do Silêncio", "Meditação", "Monge do Silêncio"],
      ["c05", "Largo das Lanternas", "Guia Espiritual", "Mestra das Lanternas"],
      ["c06", "Portal de Pedra", "Firmeza", "Guardião de Pedra"],
      ["c07", "Colina do Cruzeiro", "Elevação", "Caboclo da Colina"],
      ["c08", "Passagem das Sombras", "Travessia Segura", "Sombra do Cruzeiro"],
      ["c09", "Praça do Caminhante", "Hospedagem", "Pai do Caminho"]
    ],
    matas: [
      ["m01", "Mata das Árvores Antigas", "Sabedoria Milenar", "Jequitibá Rei"],
      ["m02", "Clareira da Lua", "Cura Lunar", "Mãe da Lua"],
      ["m03", "Trilha do Corvo", "Mensageiro", "Corvo Branco"],
      ["m04", "Vila dos Cipós", "Flexibilidade", "Mestre Cipó"],
      ["m05", "Bosque das Brumas", "Ocultamento", "Névoa Verde"],
      ["m06", "Pântano Esquecido", "Transformação", "Senhora do Lodo"],
      ["m07", "Árvore dos Ecos", "Memória Viva", "Gameleira Sagrada"],
      ["m08", "Passagem das Raízes", "Conexão", "Raiz Mãe"],
      ["m09", "Santuário Selvagem", "Refúgio", "Pantera Negra"]
    ],
    "calunga-grande": [
      ["g01", "Praia das Marés", "Ciclos", "Iemanjá"],
      ["g02", "Porto das Almas", "Chegada e Partida", "Barqueiro"],
      ["g03", "Baía do Crepúsculo", "Transição", "Oxumaré"],
      ["g04", "Ilha das Brumas", "Isolamento Sagrado", "Mestra da Névoa"],
      ["g05", "Cais da Lua", "Intuição", "Lua Cheia"],
      ["g06", "Farol Esquecido", "Orientação", "Guardião do Farol"],
      ["g07", "Gruta das Ondas", "Som Primordial", "Sirena Ancestral"],
      ["g08", "Enseada do Silêncio", "Paz", "Mar Calmo"],
      ["g09", "Costa dos Navegantes", "Jornada", "Navegador Antigo"]
    ],
    "calunga-pequena": [
      ["p01", "Cemitério das Brumas", "Comunicação Ancestral", "Omulu"],
      ["p02", "Portal das Lápides", "Acesso ao Além", "Exu Cemitério"],
      ["p03", "Jardim Silencioso", "Paz Eterna", "Mãe do Jardim"],
      ["p04", "Capela Antiga", "Fé", "Padre das Almas"],
      ["p05", "Campo dos Ciprestes", "Proteção dos Mortos", "Cipreste Velho"],
      ["p06", "Cripta das Sombras", "Segredos", "Guardião da Cripta"],
      ["p07", "Mausoléu da Lua", "Memória", "Lua Prateada"],
      ["p08", "Alameda das Memórias", "Lembrança", "Ancestral Silencioso"],
      ["p09", "Portão de Pedra", "Limiar", "Guardião do Portão"]
    ],
    lira: [
      ["l01", "Cidade da Lira", "Harmonia", "Rei da Lira"],
      ["l02", "Praça Escarlate", "Paixão Criativa", "Rainha Escarlate"],
      ["l03", "Beco dos Tambores", "Ritmo", "Mestre Tambor"],
      ["l04", "Salão das Máscaras", "Transformação", "Mestre das Máscaras"],
      ["l05", "Rua dos Artistas", "Expressão", "Artista Errante"],
      ["l06", "Jardim das Lanternas", "Luz na Festa", "Mestra das Lanternas"],
      ["l07", "Mercado da Meia-Noite", "Troca Mística", "Feitor da Noite"],
      ["l08", "Pátio dos Espelhos", "Auto-conhecimento", "Espelho Mágico"],
      ["l09", "Palácio das Ilusões", "Realidade Fluida", "Ilusionista Supremo"]
    ],
    almas: [
      ["a01", "Portal das Almas", "Transição", "Barqueiro das Almas"],
      ["a02", "Cidade do Crepúsculo", "Limiar", "Prefeito do Crepúsculo"],
      ["a03", "Ponte dos Ecos", "Mensagens", "Eco Eterno"],
      ["a04", "Torre do Silêncio", "Visão", "Vigia Silencioso"],
      ["a05", "Jardim Etéreo", "Beleza", "Jardineiro das Almas"],
      ["a06", "Vila das Brumas", "Comunidade", "Anciã da Bruma"],
      ["a07", "Templo do Limiar", "Rito de Passagem", "Sacerdote do Véu"],
      ["a08", "Castelo do Véu", "Mistério", "Senhor do Véu"],
      ["a09", "Trono das Sombras", "Autoridade", "Rainha das Sombras"]
    ]
  };

  function point(kind, id, name, power, mestre, x, y, extra) {
    return Object.assign({ kind, id, name, power, mestre, x, y, countsAsPoint: kind === "point" || kind === "portal" }, extra || {});
  }
  function fromAtlas(id, index, x, y, kind) {
    const row = ATLAS[id][index];
    return point(kind || "point", row[0], row[1], row[2], row[3], x, y, { realm: id });
  }

  function mapEncruzilhadas() {
    const m = blank(4);
    for (let y = 2; y < MH - 1; y++) for (let x = 2; x < MW - 1; x++) {
      const street = (x % 6 === 2 || x % 6 === 3 || y % 6 === 2 || y % 6 === 3);
      if (street) m[y][x] = 0;
    }
    edge(m, 4);
    const spots = [[9, 9], [15, 9], [21, 9], [9, 15], [15, 15], [21, 15], [9, 21], [15, 21], [21, 21]];
    const entities = spots.map((p, i) => fromAtlas("encruzilhadas", i, p[0], p[1], i === 7 ? "portal" : "point"));
    entities.push({ kind: "fire", id: "fire-e", name: "Braseiro da esquina", x: 15, y: 17.2 });
    entities.push({ kind: "person", id: "pe1", name: "Andarilho", x: 9, y: 16.5, line: "Aqui toda rua encontra outra. Não existe beco sem cruz." });
    entities.push({ kind: "person", id: "pe2", name: "Lanterninha", x: 21, y: 12.5, line: "A viela acende quando o Cruzeiro do centro abre." });
    return {
      id: "encruzilhadas",
      name: "Reino das Encruzilhadas",
      blurb: "Cidade de ruas retas que se cruzam sempre.",
      map: m, entities,
      spawn: { x: 15, y: 18.5, angle: -Math.PI / 2 },
      returnSpawn: { x: 15, y: 17.4, angle: -Math.PI / 2 },
      theme: { sky0: "#2c2418", sky1: "#8a7048", floor0: "#6a5844", floor1: "#2a2118" },
      enterLine: "Encruzilhadas. As ruas se cruzam em ângulo reto. O Cruzeiro está no centro."
    };
  }

  function mapMatas() {
    const m = blank(1);
    fillRect(m, 11, 11, 20, 20, 0);
    fillRect(m, 12, 12, 13, 14, 3);
    fillRect(m, 18, 12, 19, 14, 3);
    fillRect(m, 12, 17, 14, 18, 4);
    corridor(m, 15, 15, 4, 4);
    corridor(m, 15, 15, 26, 4);
    corridor(m, 15, 15, 4, 26);
    corridor(m, 15, 15, 26, 26);
    corridor(m, 4, 15, 27, 15);
    corridor(m, 15, 4, 15, 27);
    [[4, 4], [26, 4], [4, 26], [26, 26], [4, 15], [26, 15], [15, 4], [15, 26]].forEach(([x, y]) => fillRect(m, x - 1, y - 1, x + 1, y + 1, 0));
    edge(m, 3);
    const spots = [[4, 4], [16, 15], [26, 15], [13, 16], [5, 15], [26, 5], [15, 5], [5, 26], [26, 26]];
    const entities = spots.map((p, i) => fromAtlas("matas", i, p[0], p[1], i === 1 ? "portal" : "point"));
    entities.push({ kind: "fire", id: "fire-m", name: "Fogueira da aldeia", x: 16.8, y: 17.2 });
    entities.push({ kind: "person", id: "pm1", name: "Mateiro", x: 14.2, y: 16.8, line: "A aldeia é o claro. O resto é mata fechada." });
    entities.push({ kind: "person", id: "pm2", name: "Menina das folhas", x: 18.5, y: 16.2, line: "Não saia da trilha. A floresta devolve quem se perde." });
    return {
      id: "matas", name: "Reino das Matas", blurb: "Aldeia no claro, floresta em volta.",
      map: m, entities,
      spawn: { x: 16, y: 18.2, angle: -Math.PI / 2 },
      returnSpawn: { x: 16, y: 17.2, angle: -Math.PI / 2 },
      theme: { sky0: "#143226", sky1: "#3d8a52", floor0: "#3e5a28", floor1: "#182010" },
      enterLine: "Matas. Uma aldeia no centro e floresta por todos os lados."
    };
  }

  function mapPorto() {
    const m = blank(0);
    edge(m, 2);
    for (let y = 1; y < MH - 1; y++) for (let x = 22; x < MW - 1; x++) m[y][x] = 6;
    for (let x = 18; x <= 29; x++) for (let y = 15; y <= 17; y++) m[y][x] = 0;
    for (let x = 18; x <= 28; x++) for (let y = 6; y <= 8; y++) m[y][x] = 0;
    for (let y = 2; y < 30; y++) m[y][18] = 0;
    [[25, 4], [28, 11], [27, 21], [24, 26], [29, 8]].forEach(([x, y]) => { if (m[y][x] === 6) m[y][x] = 2; });
    fillRect(m, 8, 5, 10, 8, 5);
    fillRect(m, 12, 5, 15, 7, 4);
    fillRect(m, 12, 20, 15, 23, 4);
    fillRect(m, 6, 18, 8, 21, 2);
    const spots = [[20.5, 11.5], [14.5, 14.5], [20.5, 22.5], [26.5, 7], [27.5, 16], [6.5, 6.5], [5.5, 23.5], [20.5, 27.5], [10.5, 16.5]];
    const portalIndex = 1;
    const entities = spots.map((p, i) => fromAtlas("calunga-grande", i, p[0], p[1], i === portalIndex ? "portal" : "point"));
    entities.push({ kind: "fire", id: "fire-g", name: "Braseiro do cais", x: 19.2, y: 16 });
    entities.push({ kind: "person", id: "pg1", name: "Estivador", x: 17.2, y: 16.2, line: "O mar é o lado direito. O cais entra na água." });
    entities.push({ kind: "person", id: "pg2", name: "Pescadora", x: 24.5, y: 16.8, line: "Daqui se vê pedra, cais e o cruzeiro da praia." });
    return {
      id: "calunga-grande", name: "Reino da Calunga Grande", blurb: "Cidade portuária. Um lado é praia, cais e pedra.",
      map: m, entities,
      spawn: { x: 16.5, y: 16, angle: 0 },
      returnSpawn: { x: 16.2, y: 14.5, angle: Math.PI / 2 },
      theme: { sky0: "#16344a", sky1: "#7eb4d4", floor0: "#c2a06a", floor1: "#6a4e30" },
      enterLine: "Calunga Grande. Cidade do porto. À direita, praia, cais e pedras."
    };
  }

  function mapCemiterio() {
    const m = blank(0);
    edge(m, 2);
    for (let y = 3; y < 29; y++) {
      if (y % 3 === 0) continue;
      for (let x = 3; x < 29; x++) if (x % 2 === 0) m[y][x] = 8;
    }
    fillRect(m, 13, 13, 18, 18, 0);
    fillRect(m, 14, 14, 17, 15, 5);
    m[15][15] = 0; m[15][16] = 0;
    fillRect(m, 14, 27, 17, 30, 0);
    const spots = [[5, 6], [15, 6], [25, 6], [7, 12], [15.5, 16.8], [25, 12], [7, 24], [15, 24], [16, 28.2]];
    const entities = spots.map((p, i) => fromAtlas("calunga-pequena", i, p[0], p[1], i === 8 ? "portal" : "point"));
    entities.push({ kind: "fire", id: "fire-p", name: "Vela do portão", x: 14.2, y: 28.2 });
    entities.push({ kind: "person", id: "pp1", name: "Coveiro", x: 15, y: 21, line: "Não é vila. É um cemitério grande, fileira após fileira." });
    return {
      id: "calunga-pequena", name: "Reino da Calunga Pequena", blurb: "Um grande cemitério.",
      map: m, entities,
      spawn: { x: 15, y: 26.5, angle: -Math.PI / 2 },
      returnSpawn: { x: 15, y: 26.5, angle: -Math.PI / 2 },
      theme: { sky0: "#16141a", sky1: "#6a6258", floor0: "#4a4036", floor1: "#1a1612" },
      enterLine: "Calunga Pequena. O reino inteiro é um cemitério."
    };
  }

  function mapLira() {
    const m = blank(0);
    edge(m, 4);
    for (let y = 5; y < 27; y += 4) {
      for (let x = 3; x < 29; x++) if (x % 6 !== 0) m[y][x] = 9;
    }
    fillRect(m, 12, 12, 19, 19, 0);
    fillRect(m, 14, 6, 17, 8, 5);
    const spots = [[16, 10], [16, 15.5], [8, 8], [24, 8], [8, 16], [24, 16], [10, 22], [16, 22], [22, 22]];
    const entities = spots.map((p, i) => fromAtlas("lira", i, p[0], p[1], i === 1 ? "portal" : "point"));
    entities.push({ kind: "fire", id: "fire-l", name: "Fogueira da praça", x: 13.4, y: 15.5 });
    [["Feirante", 13.2, 13.4, "A feira ocupa as ruas. O canto vem de graça."],
     ["Mascarada", 18.2, 14.2, "Compro, troco e danço. A Lira é comércio e gente."],
     ["Tocador", 15.2, 18.2, "Se ouvir o tambor, você ainda está na cidade certa."],
     ["Comerciante", 17.4, 17.2, "Cada banca é um ponto. A praça é o Cruzeiro."]]
      .forEach((p, i) => entities.push({ kind: "person", id: "pl" + i, name: p[0], x: p[1], y: p[2], line: p[3] }));
    return {
      id: "lira", name: "Reino da Lira", blurb: "Cidade de comércio, feiras e gente.",
      map: m, entities,
      spawn: { x: 16, y: 17.8, angle: -Math.PI / 2 },
      returnSpawn: { x: 16, y: 17.6, angle: -Math.PI / 2 },
      theme: { sky0: "#3a1830", sky1: "#c46a98", floor0: "#8a5844", floor1: "#321c18" },
      enterLine: "Lira. Feiras, bancas e gente nas ruas. O Cruzeiro é a praça."
    };
  }

  function mapAlmas() {
    const m = blank(10);
    for (let x = 1; x < 31; x++) for (let y = 14; y <= 17; y++) m[y][x] = 0;
    for (let y = 1; y < 31; y++) for (let x = 7; x <= 9; x++) m[y][x] = 0;

  function columnColor(tile, texX, side, shade) {

      5: [186, 154, 78], 6: [48, 110, 168], 8: [176, 168, 150], 9: [168, 84, 112],
      10: [88, 104, 118], 11: [18, 14, 32]

      let mapX = Math.floor(player.x);
      let mapY = Math.floor(player.y);
      const deltaX = Math.abs(1 / (rayDirX || 1e-8));
      const deltaY = Math.abs(1 / (rayDirY || 1e-8));
      let stepX, stepY, sideX, sideY;
      if (rayDirX < 0) { stepX = -1; sideX = (player.x - mapX) * deltaX; }
      else { stepX = 1; sideX = (mapX + 1 - player.x) * deltaX; }
      if (rayDirY < 0) { stepY = -1; sideY = (player.y - mapY) * deltaY; }

      while (hit === 0 && guard++ < 48) {

      const start = ((VIEW_H - lineH) / 2) | 0;

      g.fillStyle = e.visited ? "#8d7a48" : "#ffe08a";
      g.fillRect(ox + e.x * scale - 3, oy + e.y * scale - 3, 6, 6);
      g.fillStyle = "#1a140c";
      g.font = "10px sans-serif";
      g.textAlign = "center";
      g.fillText(String(i + 1), ox + e.x * scale, oy + e.y * scale + 3);
    });
    if (realm.id === current.id) {
      g.save();
      g.translate(ox + player.x * scale, oy + player.y * scale);
      g.rotate(player.angle);
      g.fillStyle = "#fff";
      g.beginPath();
      g.moveTo(8, 0); g.lineTo(-5, 4); g.lineTo(-5, -4); g.fill();
      g.restore();
    }
    g.textAlign = "left";
    g.font = "13px sans-serif";
    points.forEach((e, i) => {
      g.fillStyle = e.visited ? "#8d7a48" : "#f3ead7";
      const label = (i + 1) + ". " + e.name;
      g.fillText(label, 470, 28 + i * 28);
    });
    g.fillStyle = "#b7a48a";
    g.font = "12px sans-serif";
    g.fillText(realm.safe ? "Zona segura. Nenhum inimigo entra neste mapa." : "", 470, 270);
    g.fillText(realm.id === current.id ? "Você está neste mapa." : "Mapa de consulta. Você não foi transportado.", 470, 300);
    document.getElementById("mapTitle").textContent = "Mapa local — " + realm.name;
    document.getElementById("mapHint").textContent = realm.blurb;
    document.getElementById("mapBack").style.display = mapScreen.fromAtlas ? "inline-block" : "none";
  }
  function openAtlas() {
    mapScreen.fromAtlas = false;
    showMapScreen();
    drawAtlas();
  }
  function openLocal(realmId, fromAtlas) {
    mapScreen.fromAtlas = !!fromAtlas;
    showMapScreen();
    drawLocal(world[realmId]);
  }
  function mapClick(event) {
    const rect = mapCanvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) * (mapCanvas.width / rect.width);
    const y = (event.clientY - rect.top) * (mapCanvas.height / rect.height);
    if (mapScreen.mode !== "atlas") return;
    const hit = MUNDI.find((node) => Math.hypot(node.x - x, node.y - y) < 36);
    if (hit) openLocal(hit.id, true);
  }
  function drawRadar(ox, oy, size) {
    ctx.fillStyle = "rgba(8,16,18,.8)";
    ctx.fillRect(ox, oy, size, size);
    ctx.strokeStyle = "#d4af37";
    ctx.strokeRect(ox + 0.5, oy + 0.5, size - 1, size - 1);
    const scale = size / MW;
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
      if (current.map[y][x] === 0) continue;
      ctx.fillStyle = tileColor(current.map[y][x]);
      ctx.fillRect(ox + x * scale, oy + y * scale, Math.ceil(scale), Math.ceil(scale));
    }
    ctx.fillStyle = "#ff5a5a";
    ctx.fillRect(ox + player.x * scale - 1.5, oy + player.y * scale - 1.5, 3, 3);
  }

  function update(dt) {
    if (mapScreen.open) return;
    let turn = 0;
    if (keys.has("ArrowLeft")) turn -= 1;
    if (keys.has("ArrowRight")) turn += 1;
    player.angle += turn * dt * 1.8;
    let forward = 0;
    let strafe = 0;
    if (keys.has("KeyW") || keys.has("ArrowUp")) forward += 1;
    if (keys.has("KeyS") || keys.has("ArrowDown")) forward -= 1;
    if (keys.has("KeyA")) strafe -= 1;
    if (keys.has("KeyD")) strafe += 1;
    const running = keys.has("ShiftLeft") || keys.has("ShiftRight");
    const speed = (running ? 3.1 : 1.85) * dt;
    if (forward || strafe) {
      const dirX = Math.cos(player.angle);
      const dirY = Math.sin(player.angle);
      tryMove(player.x + (dirX * forward - dirY * strafe) * speed, player.y + (dirY * forward + dirX * strafe) * speed);
    }
    state.hunger = Math.max(0, state.hunger - dt * 0.22);
    state.thirst = Math.max(0, state.thirst - dt * 0.28);
    const flame = fireEntity();
    if (dist(player, flame) < 2.2 && state.hp < 100) state.hp = Math.min(100, state.hp + dt);
    if (state.hunger < 8 || state.thirst < 8) state.hp = Math.max(0, state.hp - dt * 2);
    if (state.hp <= 0) {
      const s = current.returnSpawn || current.spawn;
      player.x = s.x; player.y = s.y; player.angle = s.angle;
      state.hp = 42; state.hunger = 42; state.thirst = 42;
      say("Você cai e acorda junto ao fogo deste reino.");
    }
    const n = nearest();
    const prompt = document.getElementById("prompt");
    if (n) {
      prompt.style.display = "block";
      prompt.textContent = n.kind === "gate" ? "[E] Portal para " + n.name
        : n.kind === "portal" ? "[E] Cruzeiro — sair para o espaço"
        : n.kind === "point" ? "[E] " + n.name
        : n.kind === "person" ? "[E] Falar com " + n.name
        : "[E] " + n.name;
    } else prompt.style.display = "none";
    paintHud();
  }
  function paintHud() {
    const set = (id, v) => { document.getElementById(id).style.width = Math.max(0, Math.min(100, v)) + "%"; };
    set("hpFill", state.hp); set("hungerFill", state.hunger); set("thirstFill", state.thirst); set("axeFill", state.axe);
    document.getElementById("hpText").textContent = "Vida " + Math.round(state.hp);
    document.getElementById("hungerText").textContent = "Fome " + Math.round(state.hunger) + "%";
    document.getElementById("thirstText").textContent = "Sede " + Math.round(state.thirst) + "%";
    document.getElementById("axeText").textContent = state.axe > 80 ? "Axé Imbuído" : "Axé Iluminado";
    const here = pointsOf(current).filter((e) => e.visited).length;
    document.getElementById("rescuedPill").textContent = current.safe
      ? "Pontos " + foundCount() + "/63 · zona segura"
      : "Pontos " + foundCount() + "/63 · aqui " + here + "/9";
    document.getElementById("modeLabel").textContent = current.name + " · 1ª pessoa";
    document.getElementById("where").textContent = current.blurb;
    document.getElementById("btnTorch").textContent = state.torch ? "Tocha acesa" : "Tocha apagada";
    document.getElementById("diary").textContent = foundCount() + " de 63 pontos reconhecidos";
  }
  function openDrawer(html) {
    const drawer = document.getElementById("drawer");
    drawer.innerHTML = html + "<p><button type='button' id='closeDrawer'>Fechar</button></p>";
    drawer.style.display = "block";
    document.getElementById("closeDrawer").onclick = () => { drawer.style.display = "none"; };
  }
  function showReinos() {
    const items = Object.values(world).map((realm) => {
      const n = pointsOf(realm).filter((e) => e.visited).length;
      return "<li><b>" + realm.name + "</b> — " + realm.blurb + (realm.safe ? "" : " (" + n + "/9)") + "</li>";
    }).join("");
    openDrawer("<h3>Como os reinos se ligam</h3><p>Seis reinos são cidades, cada uma com 9 pontos. O Cruzeiro é o espaço entre elas. O Quilombo é a zona segura: não entra na conta dos 63 e não há inimigos no mapa.</p><ul>" + items + "</ul>");
  }
  function showPontos() {
    const items = current.safe
      ? "<li>Sem pontos de força. Sem inimigos. O Cruzeiro devolve ao espaço.</li>"
      : pointsOf(current).map((e) => "<li>" + (e.visited ? "✦ " : "· ") + e.name + " — " + e.mestre + "</li>").join("");
    openDrawer("<h3>" + current.name + "</h3><p>" + current.blurb + "</p><ul>" + items + "</ul>");
  }
  function save() {
    try {
      const visited = [];
      Object.values(world).forEach((realm) => realm.entities.forEach((e) => { if (e.visited) visited.push(e.id); }));
      localStorage.setItem("estrada-reinos-v1", JSON.stringify({ visited, realm: current.id, x: player.x, y: player.y, angle: player.angle, hp: state.hp, hunger: state.hunger, thirst: state.thirst, axe: state.axe }));
    } catch (err) { /* arquivo local pode bloquear storage */ }
  }
  function load() {
    try {
      const raw = localStorage.getItem("estrada-reinos-v1");
      if (!raw) return;
      const data = JSON.parse(raw);
      Object.values(world).forEach((realm) => realm.entities.forEach((e) => { if (data.visited && data.visited.includes(e.id)) e.visited = true; }));
      if (world[data.realm]) {
        current = world[data.realm];
        player.x = data.x; player.y = data.y; player.angle = data.angle;
        state.hp = data.hp; state.hunger = data.hunger; state.thirst = data.thirst; state.axe = data.axe;
      }
    } catch (err) { /* segue o jogo novo */ }
  }

  window.addEventListener("keydown", (e) => {
    keys.add(e.code);
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    if (e.code === "KeyE") interact();
    if (e.code === "KeyT") { state.torch = !state.torch; say(state.torch ? "Tocha acesa." : "Tocha apagada."); }
    if (e.code === "KeyM" || e.code === "KeyF") {
      if (mapScreen.open && mapScreen.mode === "local" && world[mapScreen.realmId] === current) closeMap();
      else openLocal(current.id, false);
    }
    if (e.code === "Escape") {
      if (mapScreen.open) closeMap();
      document.getElementById("drawer").style.display = "none";
    }
  });
  window.addEventListener("keyup", (e) => keys.delete(e.code));
  canvas.addEventListener("click", () => canvas.requestPointerLock());
  document.addEventListener("mousemove", (e) => {
    if (document.pointerLockElement === canvas) player.angle += e.movementX * 0.003;
  });
  document.getElementById("btnView").onclick = () => openLocal(current.id, false);
  document.getElementById("btnAtlas").onclick = openAtlas;
  document.getElementById("mapClose").onclick = closeMap;
  document.getElementById("mapBack").onclick = () => drawAtlas();
  mapCanvas.addEventListener("click", mapClick);
  document.getElementById("btnTorch").onclick = () => { state.torch = !state.torch; paintHud(); };
  document.getElementById("btnGame").onclick = () => { document.getElementById("drawer").style.display = "none"; };
  document.getElementById("btnReinos").onclick = showReinos;
  document.getElementById("btnPontos").onclick = showPontos;

  function bootProblems() {
    const problems = [];
    Object.values(world).forEach((realm) => {
      const prev = current;
      current = realm;
      const spots = [realm.spawn, realm.returnSpawn].filter(Boolean);
      if (realm.arrivals) spots.push(...Object.values(realm.arrivals));
      spots.forEach((s) => { if (tileAt(s.x, s.y) !== 0) problems.push(realm.id + " spawn " + s.x + "," + s.y); });
      realm.entities.forEach((e) => { if (tileAt(e.x, e.y) !== 0) problems.push(realm.id + " " + (e.id || e.name) + " em parede " + e.x + "," + e.y); });
      const n = pointsOf(realm).length;
      if (!realm.safe && n !== 9) problems.push(realm.id + " tem " + n + " pontos");
      current = prev;
    });
    return problems;
  }

  load();
  const problems = bootProblems();
  window.ESTRADA = { world, travel, player, state, problems };
  paintHud();
  say(problems.length ? "Mapa incompleto: " + problems[0] : current.enterLine);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    renderFps();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
